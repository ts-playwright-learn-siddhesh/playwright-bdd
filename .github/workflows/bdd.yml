name: BDD

# Runs the Cucumber-BDD suite once per Playwright engine (matrix), each job
# with PARALLEL workers and the ci profile (retry 1).

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  bdd:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    name: bdd (${{ matrix.browser }})
    env:
      BROWSER: ${{ matrix.browser }}
      PARALLEL: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: npm run cucumberTs -- --profile ci
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: cucumber-report-${{ matrix.browser }}
          path: |
            reports/${{ matrix.browser }}/
            logs/
          retention-days: 7
